name: Platform Package Smoke

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "src/**"
      - "scripts/build-plugin.mjs"
      - "scripts/native-deps-smoke.mjs"
      - "scripts/verify-sqld-vector.mjs"
      - "scripts/smoke-test.mjs"
      - "web/**"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/platform-smoke.yml"
  workflow_dispatch:

jobs:
  package-smoke:
    name: ${{ matrix.os }} / package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No native bindings ship with the package anymore: sqld (@libsql/client,
        # pure JS) provides storage and embeddings are remote-only, so every
        # platform — including Intel macOS — installs and loads the same code.
        # Explicit Ubuntu pins (ubuntu-latest → 26.04 starting 2026-10-19).
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - windows-latest
          - macos-13
          - macos-15
          - macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install source dependencies
        run: bun install

      - name: Install web dependencies
        working-directory: web
        run: bun install

      - name: Build package artifacts
        run: bun run build

      - name: Run test suite
        run: bun test

      - name: Pack and install published package shape
        shell: bash
        run: |
          set -euo pipefail

          pack_dir="$RUNNER_TEMP/opencode-mem-pack"
          smoke_dir="$RUNNER_TEMP/opencode-mem-smoke"
          mkdir -p "$pack_dir" "$smoke_dir"

          npm pack --pack-destination "$pack_dir"
          tarball_path=$(find "$pack_dir" -name "opencode-mem-*.tgz" -print -quit)
          test -n "$tarball_path"

          cd "$smoke_dir"
          npm init -y
          npm install --ignore-scripts "$tarball_path"
          cp "$GITHUB_WORKSPACE/scripts/native-deps-smoke.mjs" ./native-deps-smoke.mjs
          cp "$GITHUB_WORKSPACE/scripts/smoke-test.mjs" ./smoke-test.mjs
          node ./native-deps-smoke.mjs
          node ./smoke-test.mjs
