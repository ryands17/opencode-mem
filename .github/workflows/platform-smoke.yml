name: Platform Package Smoke

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "src/**"
      - "scripts/build-plugin.mjs"
      - "scripts/native-deps-smoke.mjs"
      - "scripts/verify-sqld-vector.mjs"
      - "scripts/smoke-test.mjs"
      - "web/**"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/platform-smoke.yml"
  workflow_dispatch:

jobs:
  package-smoke:
    name: ${{ matrix.os }} / package smoke
    runs-on: ${{ matrix.os }}
    env:
      SQLD_VERSION: "0.24.32"
      OPENCODE_MEM_TEST_SQLD_URL: http://127.0.0.1:8080
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS is the target platform for the sqld backend. macos-13 was
        # retired 2025-12-04 and macos-14 on 2026-11-02, so macos-15-intel is the
        # last GitHub-hosted x86_64 runner. No native bindings ship anymore, so
        # other platforms do not add coverage for the package smoke checks.
        os:
          - macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install and start sqld
        shell: bash
        run: |
          set -euo pipefail

          asset="libsql-server-x86_64-apple-darwin.tar.xz"
          release="https://github.com/tursodatabase/libsql/releases/download/libsql-server-v${SQLD_VERSION}"
          dir="$RUNNER_TEMP/sqld"
          mkdir -p "$dir" "$RUNNER_TEMP/sqld-data"
          cd "$dir"

          curl --proto '=https' --tlsv1.2 -fsSL -O "$release/$asset"
          curl --proto '=https' --tlsv1.2 -fsSL -O "$release/$asset.sha256"
          shasum -a 256 -c "$asset.sha256"
          tar -xJf "$asset"

          SQLD_DB_PATH="$RUNNER_TEMP/sqld-data" \
            "$dir/libsql-server-x86_64-apple-darwin/sqld" > "$RUNNER_TEMP/sqld.log" 2>&1 &
          sqld_pid=$!

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "sqld ready"
              break
            fi
            if ! kill -0 "$sqld_pid" 2>/dev/null; then
              echo "sqld exited unexpectedly"
              cat "$RUNNER_TEMP/sqld.log"
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/health > /dev/null || {
            echo "sqld did not become ready"
            cat "$RUNNER_TEMP/sqld.log"
            exit 1
          }

      - name: Install source dependencies
        run: bun install

      - name: Install web dependencies
        working-directory: web
        run: bun install

      - name: Build package artifacts
        run: bun run build

      - name: Run test suite
        run: bun test

      - name: Pack and install published package shape
        shell: bash
        run: |
          set -euo pipefail

          pack_dir="$RUNNER_TEMP/opencode-mem-pack"
          smoke_dir="$RUNNER_TEMP/opencode-mem-smoke"
          mkdir -p "$pack_dir" "$smoke_dir"

          npm pack --pack-destination "$pack_dir"
          tarball_path=$(find "$pack_dir" -name "opencode-mem-*.tgz" -print -quit)
          test -n "$tarball_path"

          cd "$smoke_dir"
          npm init -y
          npm install --ignore-scripts "$tarball_path"
          cp "$GITHUB_WORKSPACE/scripts/native-deps-smoke.mjs" ./native-deps-smoke.mjs
          cp "$GITHUB_WORKSPACE/scripts/smoke-test.mjs" ./smoke-test.mjs
          node ./native-deps-smoke.mjs
          node ./smoke-test.mjs
