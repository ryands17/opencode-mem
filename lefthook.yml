pre-commit:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      glob: "*.{js,mjs,cjs,ts}"
      run: oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,mjs,cjs,ts,svelte,astro,css,html,json,jsonc,md,yml,yaml}"
      run: prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
